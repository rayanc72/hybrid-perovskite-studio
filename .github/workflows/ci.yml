name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tested application stack
        run: python -m pip install -e ".[core,md,viz,auth,backend,dev,docs]"
      - name: Check maintained package layers
        run: >-
          ruff check
          src/hps/api src/hps/core src/hps/examples src/hps/io src/hps/services
          src/hps/ui/app_main.py src/hps/ui/backend_workflows.py
          src/hps/ui/workspaces/structure
          src/hps/app.py src/hps/cli.py src/hps/__init__.py src/hps/__main__.py
          --select E4,E7,E9,F,I
      - name: Check tests for correctness errors
        run: ruff check tests --select F
      - name: Run tests
        run: python -m pytest -q
      - name: Build documentation
        run: python -m mkdocs build --strict
      - name: Build distribution artifacts
        run: python -m build
      - name: Inspect built package
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import hps; print(hps.__version__)"
