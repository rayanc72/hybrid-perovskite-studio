site_name: Hybrid Perovskite Studio
site_description: Install HPS and follow scientific workflows for structures, electronic outputs, and trajectories.
site_url: https://rayanc72.github.io/hybrid-perovskite-studio/
repo_url: https://github.com/rayanc72/hybrid-perovskite-studio
repo_name: rayanc72/hybrid-perovskite-studio
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - tables
validation:
  links:
    anchors: warn
nav:
  - Home: index.md
  - Get started:
      - Installation and first result: user-guide/getting-started.md
      - Examples and downloads: user-guide/guided-examples.md
      - Navigation and screenshots: user-guide/navigation-and-workspaces.md
  - Tutorials:
      - Structure inspection and CIF export: tutorials/structure.md
      - Bands and Excel exports: tutorials/bands.md
      - Trajectory metrics: tutorials/dynamics.md
  - Workspace guides:
      - Structure: features/structure-workspace.md
      - Electronic: features/electronic-workspace.md
      - Band Structure Studio: features/band-structure-studio.md
      - Dynamics: features/dynamics-workspace.md
      - Utilities: features/utilities-workspace.md
  - Scientific reference:
      - Input formats and conventions: reference/input-formats.md
      - Scientific fixture validation: reference/scientific-validation.md
      - Known limitations: reference/known-limitations.md
  - Troubleshooting: user-guide/troubleshooting.md
  - About and citation: about.md
  - Changelog: changelog.md
  - Developer guide:
      - Setup and documentation builds: developer/index.md
      - Architecture: architecture.md
      - Backend modernization: reference/backend-modernization.md
      - Implementation map: developer/implementation-map.md
      - Release acceptance: reference/release-acceptance.md
      - Documentation workflow: reference/documentation-workflow.md
