[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-perovskite-studio"
version = "0.1.4"
description = "Workspace-oriented Streamlit toolkit for hybrid perovskite modeling, analysis, and visualization."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  {name = "Rayan Chakraborty"},
]
keywords = [
  "hybrid perovskites",
  "materials science",
  "structure analysis",
  "streamlit",
  "electronic structure",
  "molecular dynamics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "streamlit>=1.33",
]

[project.urls]
Homepage = "https://github.com/rayanc72/hybrid-perovskite-studio"
Documentation = "https://github.com/rayanc72/hybrid-perovskite-studio/tree/main/docs"
Repository = "https://github.com/rayanc72/hybrid-perovskite-studio"
Issues = "https://github.com/rayanc72/hybrid-perovskite-studio/issues"

[project.scripts]
hps = "hps.cli:main"

[project.optional-dependencies]
core = [
  "ase",
  "kaleido",
  "matplotlib",
  "natsort",
  "networkx",
  "numpy",
  "pandas",
  "pillow",
  "plotly",
  "pymatgen",
  "pyyaml",
  "requests",
  "scipy",
  "spglib",
]
md = [
  "MDAnalysis",
  "seaborn",
]
pdf = [
  "diffpy.pdffit2",
  "diffpy.structure",
]
viz = [
  "bokeh",
  "colorcet",
  "holoviews",
  "mpld3",
  "streamlit-bokeh-events",
  "streamlit-extras",
  "streamlit-ketcher",
  "streamlit-lottie",
]
auth = [
  "streamlit-authenticator",
]
full = [
  "ase",
  "bokeh",
  "colorcet",
  "holoviews",
  "kaleido",
  "matplotlib",
  "MDAnalysis",
  "mpld3",
  "natsort",
  "networkx",
  "numpy",
  "pandas",
  "pillow",
  "plotly",
  "pymatgen",
  "pyyaml",
  "requests",
  "scipy",
  "seaborn",
  "spglib",
  "streamlit-authenticator",
  "streamlit-bokeh-events",
  "streamlit-extras",
  "streamlit-ketcher",
  "streamlit-lottie",
]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hps.ui" = ["assets/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "__pycache__",
  "output",
  "tmp",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
